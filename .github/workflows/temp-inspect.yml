name: Temp - inspect files server
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass
      - name: Inspect nginx files mapping
        run: |
          sshpass -p "${{ secrets.PASSWORD }}" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${{ secrets.USERNAME }}@8.159.143.134" 'bash -s' <<'REMOTE'
          echo "=== nginx files 相关规则 ==="
          grep -n -A4 "files" /www/server/panel/vhost/nginx/docs.micah.vip.conf 2>/dev/null | head -40
          echo "=== files 目录是否软链 ==="
          ls -la /www/wwwroot/docs.micah.vip/files/
          echo "=== 0_manual_files 是否被其他 vhost 引用 ==="
          grep -rn "0_manual_files" /www/server/panel/vhost/nginx/*.conf 2>/dev/null | head -10
          REMOTE
