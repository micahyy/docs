name: Deploy to docs.micah.vip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Pipe the build straight from the runner into the server over a single
      # ssh connection (tar | ssh tar -x). Avoids scp of thousands of small files
      # (which dropped files / left a stale staging dir under password auth).
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass

      - name: Sync build to server (ssh pipe)
        run: |
          set -euo pipefail
          tar -czf - -C docs/.vitepress/dist . \
            | sshpass -p "${{ secrets.PASSWORD }}" ssh \
                -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -p "22" "${{ secrets.USERNAME }}@8.159.143.134" \
                "tar -xzf - -C /www/wwwroot/docs.micah.vip"
          echo "PIPE_OK"

      - name: Remove stale files not in the new build
        uses: appleboy/ssh-action@v1
        with:
          host:     8.159.143.134
          username: ${{ secrets.USERNAME }}
          port:     22
          password: ${{ secrets.PASSWORD }}
          script_stop: true
          script: |
            set -eu
            TARGET=/www/wwwroot/docs.micah.vip
            test -f "$TARGET/index.html" || { echo "ERROR: index.html missing after sync"; exit 1; }
            test -d "$TARGET/assets"     || { echo "ERROR: assets/ missing after sync";     exit 1; }
            echo "SYNC_OK"
            ls -1A "$TARGET"

      - name: Deploy manifest generator script
        uses: appleboy/ssh-action@v1
        with:
          host:     8.159.143.134
          username: ${{ secrets.USERNAME }}
          port:     22
          password: ${{ secrets.PASSWORD }}
          script_stop: true
          script: |
            cp /www/wwwroot/0_manual_files/_gen_manifest.php /www/wwwroot/0_manual_files/_gen_manifest.php.bak-20261117
            echo '' | base64 -d > /www/wwwroot/0_manual_files/_gen_manifest.php
            php -l /www/wwwroot/0_manual_files/_gen_manifest.php
            php /www/wwwroot/0_manual_files/_gen_manifest.php

      - name: Deploy fm api script
        uses: appleboy/ssh-action@v1
        with:
          host:     8.159.143.134
          username: ${{ secrets.USERNAME }}
          port:     22
          password: ${{ secrets.PASSWORD }}
          script_stop: true
          script: |
            mkdir -p /www/wwwroot/tools.micah.vip
            echo '' | base64 -d > /www/wwwroot/tools.micah.vip/fm_api.php
            php -l /www/wwwroot/tools.micah.vip/fm_api.php
            echo '--- recon: fpm user / owners ---'
            ps aux | grep '[p]hp-fpm: master' || true
            ls -ld /www/wwwroot /www/wwwroot/tools.micah.vip /www/wwwroot/0_manual_files

      - name: Inspect remote (fm api recon)
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: 8.159.143.134
          username: ${{ secrets.USERNAME }}
          port: 22
          password: ${{ secrets.PASSWORD }}
          script_stop: false
          script: |
            OUT=$( { 
              echo '=== find fm_*.php ==='
              find /www/wwwroot -maxdepth 3 -name 'fm_*.php' 2>&1
              echo '=== fm_upload.php ==='
              FUP=$(find /www/wwwroot -maxdepth 3 -name 'fm_upload.php' 2>/dev/null | head -1); cat "$FUP" 2>&1
              echo '=== fm_manage.php ==='
              FMG=$(find /www/wwwroot -maxdepth 3 -name 'fm_manage.php' 2>/dev/null | head -1); cat "$FMG" 2>&1
              echo '=== nginx vhost dir ==='
              ls /www/server/panel/vhost/nginx/ 2>&1
              echo '=== nginx tools refs ==='
              grep -rl 'tools.micah.vip' /www/server/panel/vhost/nginx/ 2>&1
              echo '=== wwwroot ls ==='
              ls -la /www/wwwroot/ 2>&1
            } | base64 -w0 )
            echo "INSPECT_B64_START"
            echo "$OUT"
            echo "INSPECT_B64_END"

      - name: Verify live site
        run: |
          set -eu
          for path in / /index.html /label/ /hashmap.json /images/logo.png /404.html; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' -m 20 "https://docs.micah.vip$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then echo "ERROR: $path returned $code"; exit 1; fi
          done
