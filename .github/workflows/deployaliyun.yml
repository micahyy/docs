name: Deploy to docs.micah.vip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Pipe the build straight from the runner into the server over a single
      # ssh connection (tar | ssh tar -x). Avoids scp of thousands of small files
      # (which dropped files / left a stale staging dir under password auth).
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass

      - name: Sync build to server (ssh pipe)
        run: |
          set -euo pipefail
          tar -czf - -C docs/.vitepress/dist . \
            | sshpass -p "${{ secrets.PASSWORD }}" ssh \
                -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                -p "${{ secrets.PORT }}" "${{ secrets.USERNAME }}@${{ secrets.HOST }}" \
                "tar -xzf - -C /www/wwwroot/docs.micah.vip"
          echo "PIPE_OK"

      - name: Remove stale files not in the new build
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port:     ${{ secrets.PORT }}
          password: ${{ secrets.PASSWORD }}
          script_stop: true
          script: |
            set -eu
            TARGET=/www/wwwroot/docs.micah.vip
            test -f "$TARGET/index.html" || { echo "ERROR: index.html missing after sync"; exit 1; }
            test -d "$TARGET/assets"     || { echo "ERROR: assets/ missing after sync";     exit 1; }
            echo "SYNC_OK"
            ls -1A "$TARGET"

      - name: Verify live site
        run: |
          set -eu
          for path in / /index.html /label/ /hashmap.json /images/logo.png /404.html; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' -m 20 "https://docs.micah.vip$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then echo "ERROR: $path returned $code"; exit 1; fi
          done
