name: Deploy to docs.micah.vip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Pack the whole build into ONE tarball. Single-file scp is far more
      # reliable than uploading thousands of small files (password auth used
      # to drop files / leave a stale staging dir).
      - name: Pack build into tarball
        run: tar -czf site.tgz -C docs/.vitepress/dist .

      - name: Upload tarball to server
        uses: appleboy/scp-action@v1
        with:
          host:     ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port:     ${{ secrets.PORT }}
          password: ${{ secrets.PASSWORD }}
          source:   "site.tgz"
          target:   "/tmp"

      - name: Extract and sync to live directory
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port:     ${{ secrets.PORT }}
          password: ${{ secrets.PASSWORD }}
          script_stop: true
          script: |
            set -eu
            TARGET=/www/wwwroot/docs.micah.vip
            SRC=/tmp/site_extract
            rm -rf "$SRC"
            mkdir -p "$SRC"
            tar -xzf /tmp/site.tgz -C "$SRC"
            test -f "$SRC/index.html" || { echo "ERROR: tarball missing index.html"; exit 1; }
            test -d "$SRC/assets"     || { echo "ERROR: tarball missing assets/";     exit 1; }
            # remove files present on live but absent from the new build
            # (keep .user.ini and .well-known managed outside the build)
            find "$TARGET" -mindepth 1 -type f -printf '%P\n' | while IFS= read -r rel; do
              case "$rel" in .user.ini|.well-known/*) continue;; esac
              if [ ! -e "$SRC/$rel" ]; then rm -f "$TARGET/$rel" || true; fi
            done
            # copy the fresh build over
            cp -a "$SRC"/. "$TARGET"/
            # drop now-empty directories
            find "$TARGET" -mindepth 1 -depth -type d -empty -printf '%P\n' | while IFS= read -r rel; do
              case "$rel" in .well-known|.well-known/*) continue;; esac
              rmdir "$TARGET/$rel" 2>/dev/null || true
            done
            test -f "$TARGET/index.html" || { echo "ERROR: sync lost index.html"; exit 1; }
            test -d "$TARGET/assets"     || { echo "ERROR: sync lost assets/";     exit 1; }
            rm -rf "$SRC" /tmp/site.tgz
            echo "SYNC_OK"
            ls -1A "$TARGET"

      - name: Verify live site
        run: |
          set -eu
          for path in / /index.html /label/ /hashmap.json /images/logo.png /404.html; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' -m 20 "https://docs.micah.vip$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then echo "ERROR: $path returned $code"; exit 1; fi
          done
