name: Deploy to docs.micah.vip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Node (VitePress) ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build VitePress site
        run: npm run docs:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # ---- External links -> target="_blank" (preserves the previous behaviour) ----
      - name: Add target="_blank" to external links
        run: |
          cd docs/.vitepress/dist
          find . -name "*.html" -type f | while read -r file; do
            # Avoid double-adding target=_blank by matching only <a href="http without existing target
            perl -i -pe 's/<a(?![^>]*\starget=)(\s[^>]*?\shref="http)/<a target="_blank"$1/g' "$file"
          done
          echo "鉁?宸蹭负鎵€鏈夊閮ㄩ摼鎺ユ坊鍔?target=\"_blank\""

      # ---- SCP to server (same secrets as before, just source changed) ----
      - name: Deploy via SCP
        uses: appleboy/scp-action@v1
        with:
          host:     ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port:     ${{ secrets.PORT }}
          key:      ${{ secrets.KEY }}
          source:   "./docs/.vitepress/dist/*"
          target:   "/www/wwwroot/docs.micah.vip"
          strip_components: 3
