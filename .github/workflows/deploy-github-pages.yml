name: Deploy English site to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Repo setup requirement (one-time):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Once set, every push to main deploys the English site.
# Site URL: https://micahyy.github.io/docs/

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci || npm install

      # Build the full bilingual site (zh-CN at root, en at /en/), then
      # collapse dist/en/* into dist/ root for an English-only deploy.
      # /docs/ base because the project page lives at /docs/.
      - name: Build VitePress (English only, /docs/ base)
        run: npm run docs:build:en
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4