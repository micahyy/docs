<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标签打印中心 · CZMAO</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f4f4f6; color:#1a1a1a; font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
         -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .wrap { max-width:960px; margin:0 auto; padding:28px 24px 60px;}
  header { border-bottom:2px solid #111; padding-bottom:14px; margin-bottom:26px;
           display:flex; align-items:baseline; justify-content:space-between;}
  header .logo { font-size:22px; font-weight:800; letter-spacing:2px;}
  header .sub { font-size:11px; color:#888; letter-spacing:2px;}

  .cat { margin-bottom:30px;}
  .cat h2 { font-size:15px; font-weight:800; letter-spacing:1px; margin-bottom:14px;
            padding-left:10px; border-left:4px solid #111; display:flex; align-items:baseline; gap:10px;}
  .cat h2 span { font-size:11px; font-weight:500; color:#999; letter-spacing:0;}

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
  .card { display:block; text-decoration:none; color:#1a1a1a; background:#fff;
          border:1px solid #e3e3e6; border-radius:10px; padding:18px 18px 16px;
          transition:box-shadow .15s, transform .15s, border-color .15s;}
  .card:hover { box-shadow:0 6px 18px rgba(0,0,0,.09); transform:translateY(-2px); border-color:#bbb;}
  .card .ic { font-size:22px; margin-bottom:10px;}
  .card .t { font-size:15px; font-weight:700; margin-bottom:4px;}
  .card .d { font-size:12px; color:#888; line-height:1.5;}
  .card .go { margin-top:12px; font-size:12px; font-weight:700; color:#111;}
  footer { margin-top:40px; text-align:center; font-size:12px; color:#aaa;}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">标签打印中心</div>
      <div class="sub">CZMAO · 菜籽猫客制化</div>
    </header>

    <!-- 分类：87 键 TKL -->
    <section class="cat">
      <h2>87 键 TKL <span>EC 静电容 / 有线</span></h2>
      <div class="grid">
        <a class="card" href="EC87.html">
          <div class="ic">⌨️</div>
          <div class="t">EC87 快捷键说明书</div>
          <div class="d">A5 · 配列图 / Fn·Fn2 快捷键 / 刷机方法 / 二维码</div>
          <div class="go">打开并打印 →</div>
        </a>
        <a class="card" href="EC87_cert.html">
          <div class="ic">📋</div>
          <div class="t">EC87 合格证 · 保修卡</div>
          <div class="d">A5 · 产品合格证 / 保修条款 / 维修记录</div>
          <div class="go">打开并打印 →</div>
        </a>
      </div>
    </section>

    <!-- 以后新分类照此复制：
    <section class="cat">
      <h2>分类名 <span>备注</span></h2>
      <div class="grid"> 卡片… </div>
    </section>
    -->

    <footer>菜籽猫客制化键盘 · maiku.taobao.com · micah.vip</footer>
  </div>
</body>
</html>
